name: Real Solana/Jupiter Dry Run

on:
  workflow_dispatch:
    inputs:
      wallet_public_key:
        description: "Test wallet public key"
        required: true
        default: "BoQjeJzpBTFzNyGStuAvDYsrvbwfGhd3Wspw5PLMnY6s"
        type: string
      position_mint:
        description: "Test token mint"
        required: true
        default: "H9gp9xGBEeKcpUNqci1y9nLBALEW6gMHRDoGuyg6pump"
        type: string
      rpc_url:
        description: "Solana RPC endpoint"
        required: true
        default: "https://api.mainnet-beta.solana.com"
        type: string
  push:
    paths:
      - ".github/workflows/real-solana-dry-run.yml"

permissions:
  contents: read

jobs:
  real-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-exit-bot
    env:
      MODE: dry-run
      DRY_RUN: "true"
      LIVE_TRADING_ENABLED: "false"
      WALLET_PUBLIC_KEY: ${{ inputs.wallet_public_key || 'BoQjeJzpBTFzNyGStuAvDYsrvbwfGhd3Wspw5PLMnY6s' }}
      POSITION_MINT: ${{ inputs.position_mint || 'H9gp9xGBEeKcpUNqci1y9nLBALEW6gMHRDoGuyg6pump' }}
      RPC_ENDPOINTS: ${{ inputs.rpc_url || 'https://api.mainnet-beta.solana.com' }}
      POSITION_DECIMALS: "6"
      POSITION_AMOUNT: "1"
      POSITION_ENTRY_PRICE: "1"

    steps:
      - name: Checkout dry-run implementation
        uses: actions/checkout@v5
        with:
          ref: p0-real-dry-run

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana-exit-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck / build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Print dry-run target
        run: |
          echo "DRY_RUN=true"
          echo "LIVE_TRADING_ENABLED=false"
          echo "WALLET_PUBLIC_KEY=$WALLET_PUBLIC_KEY"
          echo "POSITION_MINT=$POSITION_MINT"
          echo "RPC_ENDPOINTS=$RPC_ENDPOINTS"

      - name: Run real mainnet dry-run
        run: npm run dry-run:real

      - name: Assert no broadcast code path was requested
        run: |
          test "$MODE" = "dry-run"
          test "$DRY_RUN" = "true"
          test "$LIVE_TRADING_ENABLED" = "false"
          echo "Safety gate passed: dry-run only; no transaction broadcast is permitted."
