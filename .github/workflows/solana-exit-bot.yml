name: Solana Exit Bot CI

on:
  push:
    branches: [main]
    paths:
      - "solana-exit-bot/**"
      - ".github/workflows/solana-exit-bot.yml"
  pull_request:
    paths:
      - "solana-exit-bot/**"
      - ".github/workflows/solana-exit-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-exit-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana-exit-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / build
        run: npm run build

      - name: Run tests
        run: npm test
