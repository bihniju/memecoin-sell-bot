name: Solana Exit Bot CI

on:
  push:
    branches: [main]
    paths:
      - "solana-exit-bot/**"
      - ".github/workflows/solana-exit-bot.yml"
  pull_request:
    paths:
      - "solana-exit-bot/**"
      - ".github/workflows/solana-exit-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-exit-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana-exit-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The remaining moderate finding is a transitive uuid advisory pulled by
      # jayson through @solana/web3.js. It is not reachable through the v4-only
      # usage in this bot, and forcing uuid >=14 would break jayson's CommonJS
      # require path. Fail CI on high/critical production vulnerabilities while
      # keeping this upstream moderate advisory visible in the install logs.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck / build
        run: npm run build

      - name: Run tests
        run: npm test
